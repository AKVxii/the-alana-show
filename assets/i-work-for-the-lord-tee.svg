<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">I work for The Lord. — The Alana Show tee concept</title>
  <desc id="desc">Natural Raw tee concept with navy and warm-gold typography reading I work for The Lord. and The Alana Show.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#0d2744"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b98734"/>
      <stop offset="0.5" stop-color="#d8b55f"/>
      <stop offset="1" stop-color="#a9782d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="26" y="26" width="1548" height="848" rx="18" fill="none" stroke="url(#gold)" stroke-width="2" opacity=".9"/>
  <rect x="42" y="42" width="1516" height="816" rx="14" fill="none" stroke="#d8b55f" stroke-width="1" opacity=".36"/>

  <text x="96" y="118" fill="#d8b55f" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" letter-spacing="5">06 · LORD TEE</text>
  <text x="96" y="162" fill="#f4ead7" font-family="Georgia, 'Times New Roman', serif" font-size="28">A faith-forward Alana Show statement piece.</text>

  <g filter="url(#shadow)">
    <path d="M591 178c49-33 95-49 137-49h144c42 0 88 16 137 49l121 88-82 126-102-54v397c0 34-19 52-56 52H710c-37 0-56-18-56-52V338l-102 54-82-126 121-88z" fill="#f3ebdc" stroke="#d7cbb8" stroke-width="3"/>
    <path d="M728 129c10 44 39 66 72 66s62-22 72-66" fill="none" stroke="#d7cbb8" stroke-width="5"/>
    <path d="M670 326h260" stroke="#e4d9c7" stroke-width="2" opacity=".45"/>
  </g>

  <g text-anchor="middle">
    <text x="800" y="405" fill="#082747" font-family="Georgia, 'Times New Roman', serif" font-size="54">I work for</text>
    <text x="800" y="500" fill="#082747" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-style="italic">The Lord.</text>
    <line x1="675" y1="540" x2="760" y2="540" stroke="#b8893d" stroke-width="4"/>
    <line x1="840" y1="540" x2="925" y2="540" stroke="#b8893d" stroke-width="4"/>
    <line x1="800" y1="524" x2="800" y2="556" stroke="#b8893d" stroke-width="5"/>
    <line x1="787" y1="535" x2="813" y2="535" stroke="#b8893d" stroke-width="5"/>
    <text x="800" y="605" fill="#082747" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="9">THE ALANA SHOW</text>
  </g>

  <text x="800" y="838" text-anchor="middle" fill="#d8b55f" font-family="Georgia, 'Times New Roman', serif" font-size="24" letter-spacing="4">REAL CONVERSATIONS. DISTINCT VOICES.</text>
