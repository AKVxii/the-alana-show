<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">The Alana Show merchandise collection</title>
  <desc id="desc">Four cream quote shirts and one cream Save it for the show hat in navy and warm gold.</desc>
  <defs>
    <style>
      .navy{fill:#0b1d38}.gold{fill:#bd963f}.cream{fill:#fffaf0}.line{stroke:#bd963f;stroke-width:2;fill:none}
      .serif{font-family:Georgia,'Times New Roman',serif}.sans{font-family:Arial,sans-serif}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#14233a" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1440" height="960" fill="#faf6ef"/>
  <rect x="38" y="38" width="1364" height="884" rx="18" fill="#fffdf8" stroke="#d8b866" stroke-opacity=".55"/>

  <g transform="translate(86 98)">
    <text x="0" y="0" class="navy sans" font-size="18" font-weight="700" letter-spacing="5">THE</text>
    <text x="0" y="58" class="navy serif" font-size="58" font-style="italic">Alana</text>
    <text x="0" y="90" class="navy sans" font-size="17" font-weight="700" letter-spacing="6">SHOW</text>
    <line x1="0" y1="122" x2="380" y2="122" class="line"/>
    <text x="0" y="212" class="navy serif" font-size="82">Merchandise</text>
    <text x="0" y="270" class="navy serif" font-size="28">Limited individual orders.</text>
    <text x="0" y="314" class="gold serif" font-size="32" font-style="italic">Shirts and hats by request.</text>
    <rect x="0" y="362" width="330" height="72" rx="36" fill="#071b36"/>
    <text x="165" y="407" text-anchor="middle" class="cream sans" font-size="17" font-weight="700" letter-spacing="4">INQUIRE TO ORDER</text>
    <text x="0" y="494" class="navy sans" font-size="17">Four shirts · one hat · made to order</text>
    <text x="0" y="528" class="navy sans" font-size="15" opacity=".68">Availability, timing, shipping, and payment confirmed by email.</text>
  </g>

  <!-- Shirt 1 -->
  <g transform="translate(585 118)" filter="url(#shadow)">
    <path d="M66 45 112 18h92l46 27 70 40-37 72-46-25v282H79V132l-46 25L-4 85z" class="cream" stroke="#e7dcc8"/>
    <text x="158" y="140" text-anchor="middle" class="navy serif" font-size="25">If someone</text>
    <text x="158" y="172" text-anchor="middle" class="gold serif" font-size="28" font-style="italic">isn’t in the</text>
    <text x="158" y="212" text-anchor="middle" class="navy serif" font-size="45">room</text>
    <text x="158" y="248" text-anchor="middle" class="navy serif" font-size="27" font-style="italic">don’t talk</text>
    <text x="158" y="281" text-anchor="middle" class="navy serif" font-size="27">about <tspan class="gold" font-style="italic">em.</tspan></text>
    <text x="158" y="452" text-anchor="middle" class="navy sans" font-size="14" font-weight="700" letter-spacing="3">ROOM TEE I</text>
  </g>

  <!-- Shirt 2 front -->
  <g transform="translate(900 118)" filter="url(#shadow)">
    <path d="M66 45 112 18h92l46 27 70 40-37 72-46-25v282H79V132l-46 25L-4 85z" class="cream" stroke="#e7dcc8"/>
    <text x="158" y="115" text-anchor="middle" class="gold serif" font-size="18">AKV</text>
    <text x="158" y="165" text-anchor="middle" class="navy serif" font-size="25">If someone</text>
    <text x="158" y="198" text-anchor="middle" class="gold serif" font-size="28" font-style="italic">isn’t in the</text>
    <text x="158" y="239" text-anchor="middle" class="navy serif" font-size="44">room</text>
    <text x="158" y="452" text-anchor="middle" class="navy sans" font-size="14" font-weight="700" letter-spacing="3">ROOM TEE II</text>
  </g>

  <!-- Shirt 2 back hint -->
  <g transform="translate(1202 142)" opacity=".95">
    <path d="M42 34 77 14h70l35 20 52 30-27 54-35-19v212H53V99l-35 19-27-54z" class="cream" stroke="#e7dcc8"/>
    <text x="112" y="128" text-anchor="middle" class="navy serif" font-size="26" font-style="italic">don’t</text>
    <text x="112" y="162" text-anchor="middle" class="navy serif" font-size="27">talk</text>
    <text x="112" y="196" text-anchor="middle" class="navy serif" font-size="27">about</text>
    <text x="112" y="232" text-anchor="middle" class="gold serif" font-size="30" font-style="italic">em.</text>
  </g>

  <!-- Bottom products -->
  <g transform="translate(590 570)" filter="url(#shadow)">
    <path d="M44 32 77 12h66l33 20 48 28-25 49-33-17v198H54V92l-33 17L-4 60z" class="cream" stroke="#e7dcc8"/>
    <text x="110" y="118" text-anchor="middle" class="navy serif" font-size="24">All over</text>
    <text x="110" y="148" text-anchor="middle" class="navy serif" font-size="27">the map</text>
    <text x="110" y="180" text-anchor="middle" class="navy serif" font-size="20" font-style="italic">so you don’t</text>
    <text x="110" y="207" text-anchor="middle" class="navy serif" font-size="20" font-style="italic">have to be.</text>
    <text x="110" y="325" text-anchor="middle" class="navy sans" font-size="13" font-weight="700" letter-spacing="3">MAP TEE</text>
  </g>

  <g transform="translate(850 570)" filter="url(#shadow)">
    <path d="M44 32 77 12h66l33 20 48 28-25 49-33-17v198H54V92l-33 17L-4 60z" class="cream" stroke="#e7dcc8"/>
    <text x="110" y="121" text-anchor="middle" class="navy serif" font-size="31">Save</text>
    <text x="110" y="153" text-anchor="middle" class="gold serif" font-size="28" font-style="italic">it</text>
    <text x="110" y="181" text-anchor="middle" class="navy serif" font-size="26">for the</text>
    <text x="110" y="222" text-anchor="middle" class="navy serif" font-size="40">show.</text>
    <text x="110" y="325" text-anchor="middle" class="navy sans" font-size="13" font-weight="700" letter-spacing="3">SHOW TEE</text>
  </g>

  <g transform="translate(1110 620)" filter="url(#shadow)">
    <path d="M0 112c12-79 69-116 142-116 73 0 129 37 142 116-41 23-88 34-142 34S41 135 0 112z" class="cream" stroke="#e7dcc8"/>
    <path d="M70 142c63-11 128-7 196 13-42 29-97 43-166 42-30 0-58-7-84-20 12-16 30-28 54-35z" fill="#f3eadc" stroke="#e7dcc8"/>
    <text x="142" y="65" text-anchor="middle" class="navy serif" font-size="24">Save</text>
    <text x="142" y="91" text-anchor="middle" class="gold serif" font-size="22" font-style="italic">it</text>
    <text x="142" y="116" text-anchor="middle" class="navy serif" font-size="21">for the show.</text>
    <text x="142" y="235" text-anchor="middle" class="navy sans" font-size="13" font-weight="700" letter-spacing="3">SHOW HAT</text>
  </g>

  <line x1="84" y1="872" x2="1356" y2="872" class="line" opacity=".55"/>
  <text x="720" y="912" text-anchor="middle" class="navy serif" font-size="20" font-style="italic">Premium pieces inspired by the show.</text>
</svg>
