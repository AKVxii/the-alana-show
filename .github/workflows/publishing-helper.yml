name: Publishing Helper Gate

on:
  pull_request:
    paths:
      - "scripts/publish-conversation.mjs"
      - "scripts/publish-conversation-safe.mjs"
      - "scripts/distribution-brief.mjs"
      - "scripts/sync-hub-authority.mjs"
      - "scripts/sync-sitemap-freshness.mjs"
      - "scripts/sitemap-gate.mjs"
      - "content/conversation.example.json"
      - "PUBLISHING.md"
      - "package.json"
      - "sitemap.xml"
      - ".github/workflows/publishing-helper.yml"

permissions:
  contents: read

jobs:
  publish-smoke-test:
    name: Publish a disposable conversation and validate the site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Create disposable conversation intake
        run: |
          cat > /tmp/alana-conversation-smoke-test.json <<'JSON'
          {
            "videoId": "A1b2C3d4E5F",
            "slug": "publishing-helper-ci-smoke-test",
            "title": "Publishing Helper CI Smoke Test",
            "description": "Disposable CI-only record used to verify The Alana Show publishing workflow.",
            "publishedAt": "2026-08-10T12:00:00Z",
            "durationSeconds": 1800,
            "thumbnail": "https://i.ytimg.com/vi/A1b2C3d4E5F/hqdefault.jpg",
            "guests": [
              {
                "name": "Publishing Helper Test Guest",
                "slug": "publishing-helper-test-guest"
              }
            ]
          }
          JSON

      - name: Exercise complete safe publishing transaction
        run: npm run publish:conversation -- /tmp/alana-conversation-smoke-test.json | tee /tmp/alana-publish-output.txt

      - name: Verify generated static video search metadata
        run: |
          grep -q '"@type":"VideoObject"' episodes/publishing-helper-ci-smoke-test/index.html
          grep -q '"@type":"SeekToAction"' episodes/publishing-helper-ci-smoke-test/index.html
          grep -q '"uploadDate":"2026-08-10T12:00:00Z"' episodes/publishing-helper-ci-smoke-test/index.html
          grep -q '"duration":"PT30M"' episodes/publishing-helper-ci-smoke-test/index.html
          grep -q 'publishing-helper-ci-smoke-test?t={seek_to_second_number}' episodes/publishing-helper-ci-smoke-test/index.html

      - name: Verify discovery hubs and sitemap stayed synchronized
        run: |
          grep -q 'publishing-helper-ci-smoke-test' episodes/index.html
          grep -q 'publishing-helper-test-guest' guests/index.html
          grep -q '<loc>https://thealanashow.com/episodes/publishing-helper-ci-smoke-test</loc>' sitemap.xml
          grep -q '<loc>https://thealanashow.com/guests/publishing-helper-test-guest</loc>' sitemap.xml
          grep -q '<lastmod>' sitemap.xml
          ! grep -q '<priority>' sitemap.xml
          ! grep -q '<changefreq>' sitemap.xml

      - name: Verify post-publish distribution brief
        run: |
          grep -q 'THE ALANA SHOW — POST-PUBLISH DISTRIBUTION BRIEF' /tmp/alana-publish-output.txt
          grep -q 'Canonical episode: https://thealanashow.com/episodes/publishing-helper-ci-smoke-test' /tmp/alana-publish-output.txt
          grep -q 'Publishing Helper Test Guest: https://thealanashow.com/guests/publishing-helper-test-guest' /tmp/alana-publish-output.txt
          grep -q 'YouTube: https://www.youtube.com/watch?v=A1b2C3d4E5F' /tmp/alana-publish-output.txt
          grep -q 'More from The Alana Show: https://thealanashow.com/episodes/publishing-helper-ci-smoke-test' /tmp/alana-publish-output.txt
          grep -q 'https://thealanashow.com/press' /tmp/alana-publish-output.txt
