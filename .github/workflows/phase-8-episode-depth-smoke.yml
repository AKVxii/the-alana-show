name: Phase 8 episode depth smoke

on:
  push:
    branches:
      - phase-8-episode-depth

jobs:
  smoke:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase-8-episode-depth
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Create disposable conversation intake
        run: |
          cat > /tmp/episode-depth-smoke.json <<'JSON'
          {
            "videoId": "Z9y8X7w6V5U",
            "slug": "episode-depth-ci-smoke-test",
            "title": "Episode Depth CI Smoke Test",
            "description": "Disposable editorial description used to verify that a brand-new episode receives a crawler-visible overview before YouTube feed metadata has propagated.",
            "publishedAt": "2026-08-10T12:00:00Z",
            "durationSeconds": 1800,
            "thumbnail": "https://i.ytimg.com/vi/Z9y8X7w6V5U/hqdefault.jpg",
            "guests": [
              { "name": "Episode Depth Test Guest", "slug": "episode-depth-test-guest" }
            ]
          }
          JSON
      - name: Run real publishing workflow
        run: node scripts/publish-conversation.mjs /tmp/episode-depth-smoke.json
      - name: Verify crawler-visible episode depth
        shell: bash
        run: |
          test -f episodes/episode-depth-ci-smoke-test/index.html
          grep -q 'data-static-episode-overview' episodes/episode-depth-ci-smoke-test/index.html
          grep -q 'Disposable editorial description used to verify' episodes/episode-depth-ci-smoke-test/index.html
          grep -q 'data-static-crawl-fallback="guest"' guests/episode-depth-test-guest/index.html
          echo "Episode depth publishing smoke passed."
