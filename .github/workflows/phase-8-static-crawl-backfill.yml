name: Phase 8 static crawl backfill

on:
  push:
    branches:
      - phase-8-static-crawl

permissions:
  contents: write

jobs:
  backfill:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase-8-static-crawl
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Backfill crawler-visible archive shells
        run: node scripts/backfill-static-crawl.mjs
      - name: Run quality suite
        run: npm run quality
      - name: Commit generated archive shells
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add episodes guests
          git commit -m "Backfill static crawl content for archive pages"
          git push origin HEAD:phase-8-static-crawl
