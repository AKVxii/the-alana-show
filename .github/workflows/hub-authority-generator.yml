name: Hub Authority Generator

on:
  push:
    branches:
      - phase-8-hub-authority
    paths:
      - .github/workflows/hub-authority-generator.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-8-hub-authority
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Wire hub sync into publishing and authority gates
        shell: python
        run: |
          from pathlib import Path

          publisher_path = Path('scripts/publish-conversation.mjs')
          publisher = publisher_path.read_text()
          publisher = publisher.replace(
              'const guestHubPath = "guests/index.html";\nconst sitemapPath = "sitemap.xml";',
              'const guestHubPath = "guests/index.html";\nconst topicsHubPath = "topics/index.html";\nconst sitemapPath = "sitemap.xml";'
          )
          publisher = publisher.replace(
              '  [guestHubPath, read(guestHubPath)],\n  [sitemapPath, read(sitemapPath)]',
              '  [guestHubPath, read(guestHubPath)],\n  [topicsHubPath, read(topicsHubPath)],\n  [sitemapPath, read(sitemapPath)]'
          )
          needle = '''  if (crawlResult.status !== 0) {
            rollback();
            fail("Static crawl backfill failed. Publishing changes were rolled back.");
          }

          if (!skipChecks) {'''
          replacement = '''  if (crawlResult.status !== 0) {
            rollback();
            fail("Static crawl backfill failed. Publishing changes were rolled back.");
          }

          const hubResult = spawnSync(process.execPath, ["scripts/sync-hub-authority.mjs"], { cwd: ROOT, stdio: "inherit" });
          if (hubResult.status !== 0) {
            rollback();
            fail("Hub authority sync failed. Publishing changes were rolled back.");
          }

          if (!skipChecks) {'''
          if needle not in publisher:
              raise SystemExit('Could not find publishing backfill insertion point')
          publisher = publisher.replace(needle, replacement)
          publisher_path.write_text(publisher)

          gate_path = Path('scripts/authority-gate.mjs')
          gate = gate_path.read_text()
          gate = gate.replace(
              "const homepage = read('index.html');\nconst detail = read('src/detail-page.js');",
              "const homepage = read('index.html');\nconst episodeHub = read('episodes/index.html');\nconst guestHub = read('guests/index.html');\nconst topicsHub = read('topics/index.html');\nconst publisher = read('scripts/publish-conversation.mjs');\nconst hubSync = read('scripts/sync-hub-authority.mjs');\nconst detail = read('src/detail-page.js');"
          )
          marker = "assert(vercel.includes('max-image-preview:large, max-video-preview:-1'), 'Search previews must allow large images and unrestricted video preview length.');\n"
          addition = marker + '''

          for (const [label, source] of [['Episodes', episodeHub], ['Guests', guestHub], ['Topics', topicsHub]]) {
            assert(source.includes('id="hub-structured-data"'), `${label} hub must publish a stable structured-data graph.`);
            assert(source.includes('"@type":"CollectionPage"'), `${label} hub must identify itself as a CollectionPage.`);
            assert(source.includes('"@type":"ItemList"'), `${label} hub must enumerate its canonical child pages with an ItemList.`);
          }
          assert(topicsHub.includes('class="static-crawl-fallback"'), 'Topics hub must expose a crawler-visible fallback before JavaScript.');
          assert(topicsHub.includes('/topics/leadership/'), 'Topics hub fallback must link to permanent topic authority pages.');
          assert(publisher.includes('scripts/sync-hub-authority.mjs'), 'Conversation publishing must refresh hub collection authority after creating a conversation.');
          assert(hubSync.includes('Hub authority synced:'), 'Hub authority sync generator must remain available and executable.');
'''
          if marker not in gate:
              raise SystemExit('Could not find authority-gate insertion point')
          gate = gate.replace(marker, addition)
          gate_path.write_text(gate)

      - name: Generate collection authority
        run: node scripts/sync-hub-authority.mjs

      - name: Run quality suite
        run: npm run quality

      - name: Commit generated hub authority
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add episodes/index.html guests/index.html topics/index.html scripts/publish-conversation.mjs scripts/authority-gate.mjs scripts/sync-hub-authority.mjs
          if git diff --cached --quiet; then
            echo "No generated changes required."
            exit 0
          fi
          git commit -m "Sync canonical discovery hub authority"
          git push origin HEAD:phase-8-hub-authority
