name: One-time hero reference update

on:
  push:
    branches:
      - phase-23-hero-image-performance
    paths:
      - ".github/workflows/hero-reference-update-once.yml"

permissions:
  contents: write

jobs:
  update:
    name: Switch remaining portrait references
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out optimization branch
        uses: actions/checkout@v4
        with:
          ref: phase-23-hero-image-performance
          fetch-depth: 0

      - name: Replace only approved portrait references
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              Path("about/index.html"),
              Path("press/index.html"),
              Path("src/components/About.js"),
              Path("scripts/distribution-gate.mjs"),
              Path("scripts/host-authority-gate.mjs"),
          ]
          old = "alana-portrait-cutout.png"
          new = "alana-portrait-cutout-v2.png"

          for file in files:
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected portrait reference not found in {file}")
              updated = text.replace(old, new)
              file.write_text(updated, encoding="utf-8")
              print(f"Updated {file}")
          PY

      - name: Commit reference updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about/index.html press/index.html src/components/About.js scripts/distribution-gate.mjs scripts/host-authority-gate.mjs
          git commit -m "Phase 23: Update remaining portrait references"
          git push origin HEAD:phase-23-hero-image-performance
