name: Sync George Master Temporary

on:
  push:
    branches:
      - update/george-lemieux-master-2026-08-19

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: update/george-lemieux-master-2026-08-19
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Sync George canonical master
        run: node scripts/sync-episode-master.mjs george-lemieux
      - name: Commit synchronized generated files
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/catalog.js episodes/george-lemieux/index.html episodes/index.html sitemap.xml video-sitemap.xml
          git commit -m "Sync George LeMieux final master metadata"
          git push origin HEAD:update/george-lemieux-master-2026-08-19
