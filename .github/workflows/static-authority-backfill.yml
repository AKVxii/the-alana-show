name: Static Authority Backfill

on:
  push:
    branches:
      - phase-8-static-authority
    paths:
      - .github/workflows/static-authority-backfill.yml

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-8-static-authority
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Backfill static archive authority
        run: node scripts/backfill-static-crawl.mjs

      - name: Run quality suite
        run: npm run quality

      - name: Commit generated archive HTML
        run: |
          if git diff --quiet; then
            echo "No static archive changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add episodes guests
          git commit -m "Backfill static archive authority"
          git push origin HEAD:phase-8-static-authority
