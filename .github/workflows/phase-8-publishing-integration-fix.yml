name: Phase 8 publishing integration fix

on:
  push:
    branches:
      - phase-8-static-crawl

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase-8-static-crawl
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Integrate scoped static backfill into publisher
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Make the backfill scopeable and keep static metadata stable.
          p = Path('scripts/backfill-static-crawl.mjs')
          s = p.read_text()
          anchor = 'const { episodes, guests, episodeById, guestById } = await import(catalogUrl);\n'
          addition = '''const episodeArg = process.argv.find(arg => arg.startsWith("--episode="));\nconst guestsArg = process.argv.find(arg => arg.startsWith("--guests="));\nconst targetEpisodeId = episodeArg ? episodeArg.slice("--episode=".length).trim() : "";\nconst targetGuestIds = guestsArg ? new Set(guestsArg.slice("--guests=".length).split(",").map(value => value.trim()).filter(Boolean)) : null;\nconst targetEpisodes = targetEpisodeId ? episodes.filter(episode => episode.id === targetEpisodeId) : episodes;\nconst targetGuests = targetGuestIds ? guests.filter(guest => targetGuestIds.has(guest.id)) : guests;\n'''
          if addition not in s:
              if anchor not in s:
                  raise SystemExit('backfill import anchor not found')
              s = s.replace(anchor, anchor + addition, 1)

          # Remove volatile committed view-count statistics; runtime may still refresh them.
          volatile = '''    if (Number.isFinite(Number(live.viewCount)) && Number(live.viewCount) >= 0) {\n      videoObject.interactionStatistic = {\n        "@type": "InteractionCounter",\n        interactionType: { "@type": "WatchAction" },\n        userInteractionCount: Number(live.viewCount)\n      };\n    }\n'''
          s = s.replace(volatile, '')
          s = s.replace('for (const episode of episodes) {', 'for (const episode of targetEpisodes) {', 1)
          s = s.replace('for (const guest of guests) {', 'for (const guest of targetGuests) {', 1)

          # Preserve a publisher-generated VideoObject if the live feed has not caught up yet.
          old_episode_schema = '  updated = replaceStructuredData(updated, episodeGraph(episode, updated));\n'
          new_episode_schema = '''  const hasStaticDetailData = updated.includes('id="detail-structured-data"');\n  if (liveByVideoId.has(episode.videoId) || !hasStaticDetailData) {\n    updated = replaceStructuredData(updated, episodeGraph(episode, updated));\n  }\n'''
          if old_episode_schema not in s:
              raise SystemExit('episode structured-data replacement not found')
          s = s.replace(old_episode_schema, new_episode_schema, 1)
          p.write_text(s)

          # 2) Make publish-conversation self-contained: generated detail schema gets the runtime ID,
          # snapshot existing related guest pages, then backfill only the new conversation before quality.
          p = Path('scripts/publish-conversation.mjs')
          s = p.read_text()
          s = s.replace('<script type="application/ld+json">${episodeStructuredData}</script>', '<script id="detail-structured-data" type="application/ld+json">${episodeStructuredData}</script>', 1)

          snapshot_anchor = '''const snapshots = new Map([\n  [catalogPath, read(catalogPath)],\n  [episodeHubPath, read(episodeHubPath)],\n  [guestHubPath, read(guestHubPath)],\n  [sitemapPath, read(sitemapPath)]\n]);\n'''
          snapshot_extra = snapshot_anchor + '''for (const guest of guests) {\n  const guestPath = `guests/${guest.slug}/index.html`;\n  if (fs.existsSync(path.join(ROOT, guestPath))) snapshots.set(guestPath, read(guestPath));\n}\n'''
          if snapshot_extra not in s:
              if snapshot_anchor not in s:
                  raise SystemExit('publisher snapshot block not found')
              s = s.replace(snapshot_anchor, snapshot_extra, 1)

          write_anchor = '''  write(episodeRelativePath, episodeHtml);\n  guestFiles.forEach(file => write(file.relativePath, file.html));\n\n  if (!skipChecks) {\n'''
          write_replacement = '''  write(episodeRelativePath, episodeHtml);\n  guestFiles.forEach(file => write(file.relativePath, file.html));\n\n  const crawlResult = spawnSync(process.execPath, [\n    "scripts/backfill-static-crawl.mjs",\n    `--episode=${slug}`,\n    `--guests=${guests.map(guest => guest.slug).join(",")}`\n  ], { cwd: ROOT, stdio: "inherit" });\n  if (crawlResult.status !== 0) {\n    rollback();\n    fail("Static crawl backfill failed. Publishing changes were rolled back.");\n  }\n\n  if (!skipChecks) {\n'''
          if write_replacement not in s:
              if write_anchor not in s:
                  raise SystemExit('publisher write/quality block not found')
              s = s.replace(write_anchor, write_replacement, 1)
          p.write_text(s)

          # 3) The publishing script now owns backfill + quality, so avoid running both twice.
          p = Path('package.json')
          s = p.read_text()
          s = s.replace('"publish:conversation": "node scripts/publish-conversation.mjs && node scripts/backfill-static-crawl.mjs && npm run quality"', '"publish:conversation": "node scripts/publish-conversation.mjs"')
          p.write_text(s)
          PY
      - name: Refresh committed archive metadata without volatile views
        run: node scripts/backfill-static-crawl.mjs
      - name: Commit integration and regenerated archive
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts package.json episodes guests
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Integrate scoped static crawl backfill into publishing"
          git push origin HEAD:phase-8-static-crawl
