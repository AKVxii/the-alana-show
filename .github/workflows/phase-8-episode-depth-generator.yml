name: Phase 8 episode depth generator

on:
  push:
    branches:
      - phase-8-episode-depth

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase-8-episode-depth
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Add static episode overview and topic authority links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('scripts/backfill-static-crawl.mjs')
          s = p.read_text()

          import_anchor = 'const { guestProfileById } = await import(profilesUrl);\n'
          import_add = import_anchor + 'const topicsUrl = pathToFileURL(path.join(ROOT, "src/data/topic-pages.js")).href;\nconst { topicHref } = await import(topicsUrl);\n'
          if import_add not in s:
              if import_anchor not in s:
                  raise SystemExit('guest profile import anchor missing')
              s = s.replace(import_anchor, import_add, 1)

          duration_anchor = '''function isoDuration(seconds = 0) {\n  const total = Number(seconds || 0);\n  if (!Number.isFinite(total) || total <= 0) return "";\n  const hours = Math.floor(total / 3600);\n  const minutes = Math.floor((total % 3600) / 60);\n  const secs = Math.floor(total % 60);\n  return `PT${hours ? `${hours}H` : ""}${minutes ? `${minutes}M` : ""}${secs || (!hours && !minutes) ? `${secs}S` : ""}`;\n}\n'''
          helpers = duration_anchor + '''\nfunction formatDuration(seconds = 0) {\n  const total = Number(seconds || 0);\n  if (!Number.isFinite(total) || total <= 0) return "";\n  const hours = Math.floor(total / 3600);\n  const minutes = Math.floor((total % 3600) / 60);\n  const secs = Math.floor(total % 60);\n  return hours ? `${hours}:${String(minutes).padStart(2, "0")}:${String(secs).padStart(2, "0")}` : `${minutes}:${String(secs).padStart(2, "0")}`;\n}\n\nfunction formatDate(value = "") {\n  if (!value) return "";\n  const date = new Date(value);\n  if (Number.isNaN(date.valueOf())) return "";\n  return new Intl.DateTimeFormat("en-US", { year: "numeric", month: "long", day: "numeric", timeZone: "UTC" }).format(date);\n}\n\nfunction conciseOverview(value = "", fallback = "") {\n  const normalized = String(value || fallback).replace(/\\s+/g, " ").trim();\n  if (!normalized) return "";\n  return normalized.length > 420 ? `${normalized.slice(0, 417).trim()}…` : normalized;\n}\n'''
          if helpers not in s:
              if duration_anchor not in s:
                  raise SystemExit('isoDuration anchor missing')
              s = s.replace(duration_anchor, helpers, 1)

          start = s.index('function episodeFallback(episode, html) {')
          end = s.index('\n}\n\nfunction guestFallback', start) + 2
          new = '''function episodeFallback(episode, html) {\n  const live = liveByVideoId.get(episode.videoId) || null;\n  const title = pageTitle(html) || episode.title;\n  const description = pageDescription(html) || "Watch this verified conversation on The Alana Show.";\n  const overview = conciseOverview(live?.description, description);\n  const relatedGuests = (episode.guestIds || []).map(guestById).filter(Boolean);\n  const guestLinks = relatedGuests.map(guest => `<a href="/guests/${escapeHtml(guest.id)}">${escapeHtml(guest.name)}</a>`).join(" and ");\n  const date = formatDate(live?.publishedAt || "");\n  const duration = formatDuration(live?.durationSeconds || 0);\n  const meta = [date, duration].filter(Boolean).join(" · ");\n  const categories = Array.isArray(live?.categories) ? live.categories.filter(Boolean) : [];\n  const topicLinks = categories.map(category => `<a class="button button-outline" href="${escapeHtml(topicHref(category))}">${escapeHtml(category)}</a>`).join("");\n  const overviewSection = overview ? `<section class="related-section" data-static-episode-overview aria-labelledby="static-overview-heading"><p class="related-eyebrow"><span></span>ABOUT THIS CONVERSATION</p><h2 id="static-overview-heading">Episode overview</h2><p>${escapeHtml(overview)}</p></section>` : "";\n  const topicsSection = topicLinks ? `<section class="related-section" data-static-episode-topics aria-labelledby="static-topics-heading"><p class="related-eyebrow"><span></span>EXPLORE MORE</p><h2 id="static-topics-heading">Topics</h2><div class="detail-actions">${topicLinks}</div></section>` : "";\n  return `<main id="main-content" class="static-detail-fallback" data-static-crawl-fallback="episode"><section class="detail-hero"><div class="shell detail-shell">${breadcrumbs("Episodes", title)}<p class="eyebrow"><span></span> Episode</p><h1>${escapeHtml(title)}</h1>${guestLinks ? `<p class="detail-byline">A conversation with ${guestLinks}</p>` : ""}${meta ? `<p class="detail-byline">${escapeHtml(meta)}</p>` : ""}${overviewSection}${topicsSection}<div class="detail-actions"><a class="button button-gold" href="https://www.youtube.com/watch?v=${encodeURIComponent(episode.videoId)}" target="_blank" rel="noopener">Watch on YouTube</a><a class="button button-outline" href="/episodes">More conversations</a></div></div></section></main>`;\n}'''
          s = s[:start] + new + s[end:]

          old_loop = '  let updated = replaceApp(original, episodeFallback(episode, original));\n'
          new_loop = '  let updated = replaceStaticFallback(original, "episode", episodeFallback(episode, original));\n'
          if old_loop not in s:
              raise SystemExit('episode fallback loop line missing')
          s = s.replace(old_loop, new_loop, 1)
          p.write_text(s)

          # Extend the permanent crawl gate with body-parity safeguards.
          p = Path('scripts/static-crawl-gate.mjs')
          s = p.read_text()
          anchor = '''  if (!html.includes('id="detail-structured-data"')) {\n    errors.push(`${file} must ship static detail structured data before JavaScript runs.`);\n  }\n'''
          addition = anchor + '''  if (!html.includes('data-static-episode-overview')) {\n    errors.push(`${file} must expose a crawler-visible episode overview before JavaScript runs.`);\n  }\n  if (html.includes('data-static-episode-topics') && !html.includes('href="/topics/')) {\n    errors.push(`${file} static topic discovery must use permanent topic authority links.`);\n  }\n'''
          if addition not in s:
              if anchor not in s:
                  raise SystemExit('static crawl episode gate anchor missing')
              s = s.replace(anchor, addition, 1)
          p.write_text(s)
          PY
      - name: Regenerate static episode pages
        run: node scripts/backfill-static-crawl.mjs
      - name: Run full quality suite
        run: npm run quality
      - name: Commit permanent generator and episode pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/backfill-static-crawl.mjs scripts/static-crawl-gate.mjs episodes
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add crawler-visible episode overviews and topics"
          git push origin HEAD:phase-8-episode-depth
