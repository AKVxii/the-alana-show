name: Export source bundle

on:
  push:
    branches:
      - optimize/george-lemieux-discovery-2026-08-26

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Package source
        run: tar --exclude=.git -czf /tmp/the-alana-show-source.tgz .

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: the-alana-show-source
          path: /tmp/the-alana-show-source.tgz
          if-no-files-found: error
          retention-days: 1
