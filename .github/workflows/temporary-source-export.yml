name: Temporary Production Deployment

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temporary-source-export.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  VERCEL_ORG_ID: team_SzGs4SaFQ9UzaxakLfmrKucr
  VERCEL_PROJECT_ID: prj_VxNP2rAJgWvBVrA5es9fy8khWI2A
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main branch
        uses: actions/checkout@v4

      - name: Check deployment credentials
        id: credentials
        shell: bash
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Vercel CLI
        if: steps.credentials.outputs.available == 'true'
        id: install
        continue-on-error: true
        run: npm install --global vercel@latest

      - name: Pull, build, and deploy production
        if: steps.credentials.outputs.available == 'true' && steps.install.outcome == 'success'
        id: deploy
        continue-on-error: true
        shell: bash
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --scope=tas-8
          vercel build --prod --token="$VERCEL_TOKEN" --scope=tas-8
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" --scope=tas-8

      - name: Record deployment diagnostic
        if: always()
        shell: bash
        run: |
          {
            echo "workflow_commit=${GITHUB_SHA}"
            echo "credentials_available=${{ steps.credentials.outputs.available }}"
            echo "install_outcome=${{ steps.install.outcome }}"
            echo "deploy_outcome=${{ steps.deploy.outcome }}"
            echo "recorded_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > temporary-deployment-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add temporary-deployment-status.txt
          git commit -m "Record temporary deployment diagnostic" || true
          git push
