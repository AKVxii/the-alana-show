name: Temporary Source Export

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temporary-source-export.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main branch
        uses: actions/checkout@v4

      - name: Package complete deployment source
        uses: actions/upload-artifact@v4
        with:
          name: the-alana-show-production-source
          path: |
            .
            !.git/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
