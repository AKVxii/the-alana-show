name: Temporary Source Export

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temporary-source-export.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main branch
        uses: actions/checkout@v4

      - name: Package complete deployment source
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: the-alana-show-production-source
          path: |
            .
            !.git/**
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Record source artifact diagnostic
        if: always()
        shell: bash
        run: |
          {
            echo "workflow_commit=${GITHUB_SHA}"
            echo "artifact_id=${{ steps.upload.outputs.artifact-id }}"
            echo "artifact_url=${{ steps.upload.outputs.artifact-url }}"
            echo "upload_outcome=${{ steps.upload.outcome }}"
            echo "recorded_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > temporary-deployment-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add temporary-deployment-status.txt
          git commit -m "Record temporary source artifact" || true
          git push
