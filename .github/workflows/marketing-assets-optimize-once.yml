name: One-time lossless WebP optimization

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  optimize:
    name: Encode exact-pixel lossless WebP marketing graphics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out optimization branch
        uses: actions/checkout@v4
        with:
          ref: phase-25-lossless-marketing-assets
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install image encoder
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Encode and verify exact decoded pixels
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops

          pairs = [
              (Path("assets/broadcast-reach-south-florida.png"), Path("assets/broadcast-reach-south-florida-v2.webp")),
              (Path("assets/alana-show-merchandise-collection.png"), Path("assets/alana-show-merchandise-collection-v2.webp")),
          ]

          for source_path, target_path in pairs:
              with Image.open(source_path) as image:
                  source = image.convert("RGBA")
                  source.load()
              source.save(target_path, format="WEBP", lossless=True, quality=100, method=6, exact=True)
              with Image.open(target_path) as image:
                  optimized = image.convert("RGBA")
                  optimized.load()

              if source.size != optimized.size:
                  raise SystemExit(f"Dimension mismatch for {source_path}: {source.size} != {optimized.size}")
              if ImageChops.difference(source, optimized).getbbox() is not None:
                  raise SystemExit(f"Decoded pixel verification failed for {source_path}")

              before = source_path.stat().st_size
              after = target_path.stat().st_size
              reduction = 100 * (1 - after / before)
              print(f"{source_path}: {source.width}x{source.height}; {before:,} -> {after:,} bytes; {reduction:.1f}% smaller; RGBA EXACT")
              if reduction < 15:
                  raise SystemExit(f"Lossless WebP savings are not material enough for {source_path}: {reduction:.1f}%")
          PY

      - name: Commit verified lossless WebP assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/broadcast-reach-south-florida-v2.webp assets/alana-show-merchandise-collection-v2.webp
          if git diff --cached --quiet; then
            echo "Lossless WebP assets already committed."
            exit 0
          fi
          git commit -m "Phase 25: Add exact-pixel lossless WebP marketing assets"
          git push origin HEAD:phase-25-lossless-marketing-assets
