name: One-time merchandise asset optimization

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  optimize:
    name: Re-encode merchandise graphic without changing pixels
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out optimization branch
        uses: actions/checkout@v4
        with:
          ref: phase-25-lossless-marketing-assets
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install lossless PNG encoder
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Re-encode and verify exact pixels
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops

          source_path = Path("assets/alana-show-merchandise-collection.png")
          target_path = Path("assets/alana-show-merchandise-collection-v2.png")

          with Image.open(source_path) as image:
              source = image.convert("RGBA")
              source.load()
          source.save(target_path, format="PNG", optimize=True, compress_level=9)
          with Image.open(target_path) as image:
              optimized = image.convert("RGBA")
              optimized.load()

          if source.size != optimized.size:
              raise SystemExit(f"Dimension mismatch: {source.size} != {optimized.size}")
          if ImageChops.difference(source, optimized).getbbox() is not None:
              raise SystemExit("Pixel verification failed")

          before = source_path.stat().st_size
          after = target_path.stat().st_size
          reduction = 100 * (1 - after / before)
          print(f"{source.width}x{source.height}; {before:,} -> {after:,} bytes; {reduction:.1f}% smaller; RGBA EXACT")
          if after >= before:
              raise SystemExit("Optimization did not reduce merchandise asset")
          PY

      - name: Commit verified optimized asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/alana-show-merchandise-collection-v2.png
          if git diff --cached --quiet; then
            echo "Optimized asset already committed."
            exit 0
          fi
          git commit -m "Phase 25: Add pixel-identical optimized merchandise art"
          git push origin HEAD:phase-25-lossless-marketing-assets
