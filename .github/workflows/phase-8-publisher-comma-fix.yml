name: Phase 8 publisher comma fix

on:
  push:
    branches:
      - phase-8-static-crawl

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase-8-static-crawl
          fetch-depth: 0
      - name: Make catalog array appends comma-safe
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/publish-conversation.mjs')
          s = p.read_text()
          old = '''function appendArrayRecord(source, exportName, record) {\n  const { end } = arrayBounds(source, exportName);\n  return `${source.slice(0, end)}\\n${record}${source.slice(end)}`;\n}'''
          new = '''function appendArrayRecord(source, exportName, record) {\n  const { end, body } = arrayBounds(source, exportName);\n  const needsComma = Boolean(body.trim()) && !body.trimEnd().endsWith(",");\n  return `${source.slice(0, end)}${needsComma ? "," : ""}\\n${record}${source.slice(end)}`;\n}'''
          if old not in s:
              raise SystemExit('appendArrayRecord function did not match expected source')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit publisher fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/publish-conversation.mjs
          git commit -m "Make publishing catalog appends comma-safe"
          git push origin HEAD:phase-8-static-crawl
