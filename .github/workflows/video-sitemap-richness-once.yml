name: One-time enriched video sitemap regeneration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    name: Regenerate video sitemap from permanent page metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out video sitemap branch
        uses: actions/checkout@v4
        with:
          ref: phase-29-richer-video-sitemap
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Synchronize enriched video sitemap
        run: node scripts/sync-video-sitemap.mjs

      - name: Commit synchronized sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add video-sitemap.xml
          if git diff --cached --quiet; then
            echo "Video sitemap is already synchronized."
            exit 0
          fi
          git commit -m "Phase 29: Add verified duration and publication metadata to video sitemap"
          git push origin HEAD:phase-29-richer-video-sitemap
