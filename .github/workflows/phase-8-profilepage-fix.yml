name: Phase 8 guest ProfilePage fix

on:
  push:
    branches:
      - phase-8-static-crawl

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase-8-static-crawl
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Preserve ProfilePage in guest structured data
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/backfill-static-crawl.mjs')
          s = p.read_text()
          marker = 'function guestGraph(guest, html) {'
          start = s.index(marker)
          before = s[:start]
          tail = s[start:]
          old = '      "@type": "WebPage",\n      "@id": `${canonical}#webpage`,'
          new = '      "@type": "ProfilePage",\n      "@id": `${canonical}#webpage`,'
          if old not in tail:
              raise SystemExit('Guest WebPage node not found for ProfilePage conversion')
          tail = tail.replace(old, new, 1)
          p.write_text(before + tail)
          PY
      - name: Regenerate static archive metadata
        run: node scripts/backfill-static-crawl.mjs
      - name: Commit generator and generated pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/backfill-static-crawl.mjs episodes guests
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Preserve ProfilePage guest entity markup"
          git push origin HEAD:phase-8-static-crawl
