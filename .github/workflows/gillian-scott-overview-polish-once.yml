name: One-time Gillian Scott overview polish

on:
  push:
    branches:
      - fix-gillian-scott-overview-layout

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-gillian-scott-overview-layout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply page-specific overview polish
        run: python scripts/apply-gillian-scott-overview-polish.py
      - name: Run site quality suite
        run: npm test
      - name: Commit overview polish if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Overview polish already applied; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/detail-page.js
          git commit -m "Polish Gillian Scott episode overview layout"
          git push origin HEAD:fix-gillian-scott-overview-layout
