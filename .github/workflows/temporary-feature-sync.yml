name: Apply Featured Fraud Special Across Resilient Surfaces

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temporary-feature-sync.yml"

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main branch
        uses: actions/checkout@v4

      - name: Apply the approved feature selection
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Expected source text not found in {path}: {old[:100]}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "src/main.js",
              'const app = document.querySelector("#app");\n',
              'const FEATURED_CONVERSATION_VIDEO_ID = "iR4cdm9Ux3U";\nconst app = document.querySelector("#app");\n',
          )
          replace_once(
              "src/main.js",
              '    updateFeatured(data.featured || data.mostWatched || data.latest);\n',
              '    const featuredEpisode = data.featured || state.episodes.find(episode => episode.videoId === FEATURED_CONVERSATION_VIDEO_ID) || data.mostWatched || data.latest;\n    updateFeatured(featuredEpisode);\n',
          )
          replace_once(
              "src/main.js",
              '    const fallbackLatest = state.episodes[0];\n    updateFeatured(fallbackLatest);\n',
              '    const fallbackLatest = state.episodes[0];\n    const fallbackFeatured = state.episodes.find(episode => episode.videoId === FEATURED_CONVERSATION_VIDEO_ID) || fallbackLatest;\n    updateFeatured(fallbackFeatured);\n',
          )
          replace_once(
              "src/episodes-page.js",
              'const PAGE_SIZE = 9;\n',
              'const FEATURED_CONVERSATION_VIDEO_ID = "iR4cdm9Ux3U";\nconst PAGE_SIZE = 9;\n',
          )
          replace_once(
              "src/episodes-page.js",
              '  const episode = state.episodes[0];\n',
              '  const episode = state.episodes.find(item => item.videoId === FEATURED_CONVERSATION_VIDEO_ID) || state.episodes[0];\n',
          )
          replace_once(
              "src/components/Episodes.js",
              'data-initial-src="https://www.youtube-nocookie.com/embed/kJWFTnWOgYM?rel=0"',
              'data-initial-src="https://www.youtube-nocookie.com/embed/iR4cdm9Ux3U?rel=0"',
          )
          replace_once(
              "src/components/Episodes.js",
              '<a href="https://www.youtube.com/watch?v=kJWFTnWOgYM" target="_blank" rel="noopener">Watch the featured conversation on YouTube</a>',
              '<a href="https://www.youtube.com/watch?v=iR4cdm9Ux3U" target="_blank" rel="noopener">Watch the scam and fraud special on YouTube</a>',
          )
          replace_once(
              "src/components/Episodes.js",
              '<h3 data-featured-title>Chairman Michael Barnett Recaps the 2022 Midterms</h3>',
              '<h3 data-featured-title>Safeguarding Yourself from Cybercrime and Fraud</h3>',
          )
          replace_once(
              "src/components/Episodes.js",
              '<p data-featured-description>A direct conversation about public life, civic engagement, grassroots leadership, and Palm Beach County.</p>',
              '<p data-featured-description>Prosecutor Stacey Ibarra and Detective Vaughn Mitchell share practical guidance for recognizing scams, protecting personal information, and responding to cybercrime and fraud.</p>',
          )
          replace_once(
              "index.html",
              '                <li><a href="/episodes/george-lemieux">Former U.S. Senator George LeMieux — Leadership, Public Service &amp; Florida’s Future</a></li>\n                <li><a href="/episodes/scott-diament-gillian-lieberman">Gillian Lieberman &amp; Scott Diament — Palm Beach Business, Luxury &amp; Leadership</a></li>\n                <li><a href="/episodes/stacey-ibarra-vaughn-mitchell">Stacey Ibarra &amp; Vaughn Mitchell — Safeguarding Yourself from Cybercrime and Fraud</a></li>',
              '                <li><a href="/episodes/stacey-ibarra-vaughn-mitchell">Stacey Ibarra &amp; Vaughn Mitchell — Safeguarding Yourself from Cybercrime and Fraud</a></li>\n                <li><a href="/episodes/george-lemieux">Former U.S. Senator George LeMieux — Leadership, Public Service &amp; Florida’s Future</a></li>\n                <li><a href="/episodes/scott-diament-gillian-lieberman">Gillian Lieberman &amp; Scott Diament — Palm Beach Business, Luxury &amp; Leadership</a></li>',
          )
          replace_once(
              "index.html",
              '/src/home-entry.js?v=20260819-candidates-mobile',
              '/src/home-entry.js?v=20260819-fraud-special',
          )
          replace_once(
              "scripts/home-feed-resilience-gate.mjs",
              'assert(main.includes(\'updateFeatured(fallbackLatest);\'), "Homepage live-feed failure must keep a verified featured conversation.");',
              'assert(main.includes(\'const FEATURED_CONVERSATION_VIDEO_ID = "iR4cdm9Ux3U";\'), "Homepage must pin the approved scam and fraud special as its featured conversation.");\nassert(main.includes(\'updateFeatured(fallbackFeatured);\'), "Homepage live-feed failure must keep the approved featured conversation.");',
          )
          replace_once(
              "scripts/home-feed-resilience-gate.mjs",
              'assert(archive.includes(\'state.episodes = editorialEpisodes;\'), "Episodes archive must retain its verified static fallback.");',
              'assert(archive.includes(\'state.episodes = editorialEpisodes;\'), "Episodes archive must retain its verified static fallback.");\nassert(archive.includes(\'FEATURED_CONVERSATION_VIDEO_ID = "iR4cdm9Ux3U"\'), "Episodes archive must use the approved scam and fraud special as its featured conversation.");\nassert(episodesComponent.includes(\'iR4cdm9Ux3U\') && episodesComponent.includes(\'Safeguarding Yourself from Cybercrime and Fraud\'), "Homepage server-rendered featured content must match the approved scam and fraud special.");',
          )
          PY

      - name: Run complete site quality suite
        id: test
        if: steps.apply.outcome == 'success'
        continue-on-error: true
        run: npm test

      - name: Record and commit the verified result
        if: always()
        shell: bash
        run: |
          {
            echo "workflow_commit=${GITHUB_SHA}"
            echo "apply_outcome=${{ steps.apply.outcome }}"
            echo "test_outcome=${{ steps.test.outcome }}"
            echo "recorded_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > temporary-feature-sync-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add temporary-feature-sync-status.txt
          if [ "${{ steps.apply.outcome }}" = "success" ] && [ "${{ steps.test.outcome }}" = "success" ]; then
            git add src/main.js src/episodes-page.js src/components/Episodes.js index.html scripts/home-feed-resilience-gate.mjs
          fi
          git commit -m "Record featured-conversation sync result" || true
          git push
